# Render blueprint for Voxly.
# The persistent disk keeps SQLite + recordings across deploys/restarts.
services:
  - type: web
    name: voxly-voice-sales-bot
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: voxly-data
      mountPath: /var/data
      sizeGB: 1
